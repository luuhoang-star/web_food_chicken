<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="chickenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Subtle Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#FCA5A5" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Fried Chicken Drumstick Icon -->
  <g filter="url(#shadow)" transform="translate(4, 4)">
    <!-- Bone End -->
    <path d="M 12 44 C 10 44 8 42 8 40 C 8 38 10 36 12 36 C 13 36 14 36.5 14.5 37.2 L 22 30 C 21 29 20 28 20 26 C 20 24 22 22 24 22 C 26 22 28 24 28 26 C 28 27 27.5 28 26.8 28.5 L 34 36 C 34.5 35.5 35 35 36 35 C 38 35 40 37 40 39 C 40 41 38 43 36 43 C 34 43 33 42 32 41 L 24.5 48.5 C 25 49 26 50 26 51 C 26 53 24 55 22 55 C 20 55 18 53 18 51 C 18 49.5 19 48.5 20 48 L 12.5 40.5 C 12 42.5 12 44 12 44 Z" fill="#F8FAFC" opacity="0.95" />
    
    <!-- Bone Shaft -->
    <path d="M 17 39 L 26 30 L 31 35 L 22 44 Z" fill="#E2E8F0" />

    <!-- Crispy Meat Body -->
    <path d="M 22 28 C 18 20 24 10 34 8 C 44 6 52 14 50 24 C 48 34 38 40 30 36 C 26 34 23 31 22 28 Z" fill="url(#chickenGrad)" />
    
    <!-- Crispy Sauce Glaze / Highlights -->
    <path d="M 33 11 C 41 9 47 15 46 22 C 45 27 38 32 32 29 C 29 27 26 24 25 21 C 23 15 27 12 33 11 Z" fill="#FEF08A" opacity="0.6" />

    <!-- Sauce Drizzle Dots -->
    <circle cx="36" cy="18" r="2" fill="#B91C1C" />
    <circle cx="42" cy="24" r="1.5" fill="#B91C1C" />
    <circle cx="30" cy="24" r="1.5" fill="#B91C1C" />
  </g>

  <!-- Text "GAO" at bottom -->
  <text x="32" y="58" font-family="'Arial Black', 'Impact', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GAO</text>
</svg>
